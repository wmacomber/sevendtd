[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sevendtd"
version = "0.4.0.dev0"
description = "Async integration library and CLI for 7 Days to Die dedicated servers"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "SevenDTD contributors" }]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
cli = ["typer>=0.12,<1", "rich>=13.8,<16", "pillow>=10.4,<13"]

[dependency-groups]
dev = [
  "hatchling>=1.27",
  "pyright>=1.1.390",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-socket>=0.7",
  "respx>=0.22",
  "ruff>=0.8",
  "typer>=0.12,<1",
  "rich>=13.8,<16",
  "pillow>=10.4,<13",
]

[project.scripts]
7dtd = "sevendtd.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sevendtd"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src"]

[tool.pytest.ini_options]
addopts = "-m 'not integration' --disable-socket --allow-unix-socket"
asyncio_mode = "strict"
markers = [
  "integration: requires an explicitly enabled live server",
  "mutating: changes live server state",
  "destructive: may cause difficult-to-recover server changes",
  "enable_socket: permits sockets for explicitly gated live integration tests",
]
testpaths = ["tests"]
